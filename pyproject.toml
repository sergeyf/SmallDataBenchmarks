[project]
name = "small-data-benchmarks"
version = "2026.1"
description = "Small dataset classification benchmarks on UCI++"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autogluon-tabular[all]==1.6.3",
    "catboost",
    "hyperopt",
    "lightgbm",
    "matplotlib",
    "mljar-supervised>=1.3.2",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels>=0.15.0",
    "tabicl",
    "tabpfn",
    "tabulate>=0.10.0",
    "torch",
]

[tool.uv]
package = false

# Pull CUDA builds of PyTorch so TabPFN and TabICL run on the GPU.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
